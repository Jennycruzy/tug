# Public site: static build from /var/www/tug, public API proxied to the mainnet engine on loopback.
# TLS certificate: certbot certonly --nginx -d tug.38-49-216-59.sslip.io (renewed by certbot's timer).
limit_req_zone $binary_remote_addr zone=tug_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tug.38-49-216-59.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tug.38-49-216-59.sslip.io;

    ssl_certificate /etc/letsencrypt/live/tug.38-49-216-59.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tug.38-49-216-59.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.strikefinance.org https://api-v2-testnet.strikefinance.org; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/tug;
    index index.html;

    location /api/ {
        limit_req zone=tug_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.strikefinance.org https://api-v2-testnet.strikefinance.org; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
